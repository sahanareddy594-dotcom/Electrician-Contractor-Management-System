<!DOCTYPE html>
<html>
<head>
    <title>Materials</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>ECMS</h2>
    <a href="/">Dashboard</a>
    <a href="/jobs">Jobs</a>
    <a href="/electricians">Electricians</a>
    <a href="/tasks">Tasks</a>
    <a href="/materials">Materials</a>
</div>

<!-- MAIN -->
<div class="main">
    <h2>Materials</h2>

    <!-- FORM -->
    <form method="POST">

        <input type="text" name="name" placeholder="Material Name" required>

        <input type="number" name="quantity" placeholder="Total Quantity" required>

        <input type="number" name="used" placeholder="Used Quantity" required>

        <button type="submit">Add Material</button>

    </form>

    <!-- TABLE -->
    <table>
        <tr>
            <th>Name</th>
            <th>Total</th>
            <th>Used</th>
        </tr>

        {% for m in data %}
        <tr>
            <td>{{ m.name }}</td>
            <td>{{ m.quantity }}</td>
            <td>{{ m.used }}</td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
