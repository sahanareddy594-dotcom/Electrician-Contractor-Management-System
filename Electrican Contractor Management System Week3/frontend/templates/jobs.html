<!DOCTYPE html>
<html>
<head>
    <title>Jobs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>ECMS</h2>
    <a href="/">Dashboard</a>
    <a href="/jobs">Jobs</a>
    <a href="/electricians">Electricians</a>
    <a href="/tasks">Tasks</a>
    <a href="/materials">Materials</a>
</div>

<!-- MAIN CONTENT -->
<div class="main">
    <h2>Jobs</h2>

    <!-- ✅ FORM -->
    <form method="POST">

        <input type="text" name="title" placeholder="Job Title" required>

        <input type="text" name="location" placeholder="Location" required>

        <!-- ✅ NEW: DEADLINE -->
        <input type="date" name="deadline" required>

        <!-- ✅ NEW: ELECTRICIAN DROPDOWN -->
        <select name="electrician" required>
            <option value="">Select Electrician</option>
            {% for e in electricians %}
                <option value="{{ e.id }}">{{ e.name }}</option>
            {% endfor %}
        </select>

        <button type="submit">Add Job</button>

    </form>

    <!-- ✅ TABLE -->
    <table>
        <tr>
            <th>Title</th>
            <th>Location</th>
            <th>Deadline</th>
            <th>Electrician</th>
        </tr>

        {% for j in data %}
        <tr>
            <td>{{ j.title }}</td>
            <td>{{ j.location }}</td>
            <td>{{ j.deadline }}</td>
            <td>{{ j.ename }}</td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
