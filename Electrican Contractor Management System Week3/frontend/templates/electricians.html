<!DOCTYPE html>
<html>
<head>
    <title>Electricians</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>ECMS</h2>
    <a href="/">Dashboard</a>
    <a href="/jobs">Jobs</a>
    <a href="/electricians">Electricians</a>
    <a href="/tasks">Tasks</a>
    <a href="/materials">Materials</a>
</div>

<!-- MAIN -->
<div class="main">
    <h2>Electricians</h2>

    <!-- FORM -->
    <form method="POST">
        <input type="text" name="name" placeholder="Name" required>
        <input type="text" name="phone" placeholder="Phone" required>
        <input type="text" name="experience" placeholder="Experience" required>
        <button type="submit">Add Electrician</button>
    </form>

    <!-- TABLE -->
    <table>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Experience</th>
            <th>Action</th>
        </tr>

        {% for e in data %}
        <tr>
            <td>{{ e.name }}</td>
            <td>{{ e.phone }}</td>
            <td>{{ e.experience }}</td>

            <!-- ✅ DELETE BUTTON -->
            <td>
                <a href="/delete_electrician/{{ e.id }}">Delete</a>
            </td>

        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
